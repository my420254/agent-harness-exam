name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Space files
        run: |
          mkdir -p /tmp/space
          cp app.py /tmp/space/app.py
          cp -r agent /tmp/space/agent
          cp requirements.txt /tmp/space/requirements.txt
          cp SPACE_README.md /tmp/space/README.md

      - name: Create Space and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          pip install "huggingface_hub"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_repo, repo_exists

          token = os.environ["HF_TOKEN"]
          repo_id = "my420254/agent-harness-exam"
          api = HfApi(token=token)

          if not repo_exists(repo_id, repo_type="space", token=token):
              create_repo(repo_id, repo_type="space", space_sdk="gradio", token=token)

          # 打印当前 Space 运行时/硬件状态，便于诊断
          try:
              rt = api.get_space_runtime(repo_id, token=token)
              print("SPACE RUNTIME:", rt)
          except Exception as exc:  # noqa: BLE001
              print(f"runtime note: {exc}")

          # 强制 CPU 硬件（本 App 无需 GPU，LLM 走 DeepSeek 远程推理）
          try:
              api.request_space_hardware(repo_id, "cpu-basic", token=token, sleep_time=5)
          except Exception as exc:  # noqa: BLE001
              print(f"hardware note: {exc}")

          api.upload_folder(
              folder_path="/tmp/space",
              repo_id=repo_id,
              repo_type="space",
              token=token,
          )

          # 把 DeepSeek 配置设为 Space Secret（面试官看不到，Demo 才能真正答话）
          for key in ("LLM_API_KEY", "LLM_API_BASE", "LLM_MODEL"):
              value = os.environ.get(key)
              if value:
                  try:
                      api.add_space_secret(repo_id, key, value, token=token)
                  except Exception as exc:  # noqa: BLE001
                      print(f"skip secret {key}: {exc}")
          print("DEPLOYED https://huggingface.co/spaces/" + repo_id)
          PY
